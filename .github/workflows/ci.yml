name: CI baseline

on:
  pull_request:
    branches: [dev]
  # Revalidate the integrated tree, without deployment or main promotion.
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: modules/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_test
          # Synthetic password for this disposable runner only; never production.
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: usagi_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test -d usagi_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      AUTH_MODE: strict
      DATABASE_URL: postgresql+psycopg://ci_test:ci-test-only@localhost:5432/usagi_ci_test
      P2A_TEST_DATABASE_URL: postgresql+psycopg://ci_test:ci-test-only@localhost:5432/usagi_ci_test
      REDIS_URL: redis://localhost:6379/0
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            modules/backend/requirements.api.txt
            modules/backend/requirements.test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements.test.txt
      - name: Install media integration test tools
        # Test-only: FFmpeg remains a Worker dependency, not an API image dependency.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check dependencies
        run: python -m pip check
      - name: Compile Python
        run: python -m compileall -q src scripts run_worker.py
      - name: Apply and check migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Run backend tests
        # This module imports the ML stack at collection; see docs/ci.md.
        # All other tests run, including real PostgreSQL/Redis/RQ integration.
        run: python -m pytest -q --ignore=tests/test_diarization_filter.py
      - name: Test isolated benchmark metrics and cost simulation
        # Stdlib-only tests: no models, media, credentials or GPU in CI.
        run: python -m unittest discover -s ../../experiments/transcription_benchmark -v

  frontend:
    name: Frontend baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: modules/frontendv2
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/frontendv2/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm run test
      - name: Build frontend
        run: npm run build
