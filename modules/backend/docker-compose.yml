services:
  app:
    build:
      context: ../..
      dockerfile: modules/backend/Dockerfile
    container_name: transcription-app
    ports:
      - "2020:2020"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./database:/app/modules/backend/database
    depends_on:
      - db
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: modules/backend/Dockerfile
    command: ["python", "run_worker.py"]
    working_dir: /app/modules/backend
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./database:/app/modules/backend/database
    depends_on:
      - db
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: transcription-db
    environment:
      POSTGRES_DB: transcription_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
