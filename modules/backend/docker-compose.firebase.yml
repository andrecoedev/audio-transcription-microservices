# Optional Firebase ADC overlay. Prefer a private host file outside the repo;
# the legacy ignored path remains compatible. Only the API receives the file.
services:
  api:
    environment:
      FIREBASE_AUTH_ENABLED: ${FIREBASE_AUTH_ENABLED:-true}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-adminsdk.json
    volumes:
      - type: bind
        source: ${FIREBASE_ADC_HOST_PATH:-./.local-artifacts/firebase-adminsdk.json}
        target: /run/secrets/firebase-adminsdk.json
        read_only: true
        bind:
          create_host_path: false
